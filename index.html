<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC 단어장</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOEIC단어">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<div class="header">
  <div class="header-title">
    <span class="logo-badge" data-ic="book"></span>
    <div>
      <h1>TOEIC 단어장</h1>
      <div class="subtitle">AI 토익 어휘 · 800점 코스</div>
    </div>
  </div>
  <button class="settings-btn" onclick="openSettings()" title="AI 설정" data-ic="gear"></button>
</div>

<div class="nav" id="nav">
  <button class="active" data-tab="home" onclick="switchTab('home')"><span data-ic="home"></span>홈</button>
  <button data-tab="word" onclick="switchTab('word')"><span data-ic="pencil"></span>단어</button>
  <button data-tab="listen" onclick="switchTab('listen')"><span data-ic="headphones"></span>듣기</button>
  <button data-tab="grammar" onclick="switchTab('grammar')"><span data-ic="doc"></span>문법</button>
  <button data-tab="wrong" onclick="switchTab('wrong')"><span data-ic="bookmark"></span>오답 <span id="wrong-badge"></span></button>
  <button data-tab="ai" onclick="switchTab('ai')"><span data-ic="sparkles"></span>AI</button>
  <button data-tab="stats" onclick="switchTab('stats')"><span data-ic="chart"></span>통계</button>
</div>

<div class="container">

  <!-- 홈 대시보드 -->
  <div id="tab-home" class="tab-content active">
    <div id="dashboard"></div>
  </div>

  <!-- 단어 학습 (객관식/주관식) -->
  <div id="tab-word" class="tab-content">
    <div class="quiz-controls">
      <select id="word-mode">
        <option value="q1">단어 → 뜻 (객관식)</option>
        <option value="q2">뜻 → 단어 (입력)</option>
      </select>
      <select id="word-count">
        <option value="10">10문제</option>
        <option value="20" selected>20문제</option>
        <option value="50">50문제</option>
        <option value="all">전체</option>
      </select>
      <button onclick="startWordQuiz()">시작</button>
    </div>
    <div id="word-area"></div>
  </div>

  <!-- 듣기(받아쓰기) -->
  <div id="tab-listen" class="tab-content">
    <div class="quiz-controls">
      <select id="listen-count">
        <option value="10" selected>10문제</option>
        <option value="20">20문제</option>
        <option value="30">30문제</option>
      </select>
      <button onclick="startListen()">시작</button>
    </div>
    <p style="font-size:0.82rem;color:#6b7280;margin-top:4px;">🔊 발음을 듣고 단어를 입력하세요. (오프라인 가능)</p>
    <div id="listen-area"></div>
  </div>

  <!-- 문법 Part5 -->
  <div id="tab-grammar" class="tab-content">
    <h2 style="font-size:1.1rem;font-weight:700;"><span data-ic="doc"></span> Part5 문법 퀴즈</h2>
    <p style="font-size:0.82rem;color:#6b7280;margin:6px 0 14px;">AI가 학습 단어로 실전 빈칸 문제를 만들어줍니다.</p>
    <button class="ai-btn" onclick="startGrammar()">문제 생성</button>
    <div id="grammar-area"></div>
  </div>

  <!-- 오답 노트 -->
  <div id="tab-wrong" class="tab-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="font-size:1.1rem; font-weight:700;">오답 단어 목록</h2>
      <button onclick="clearWrong()" style="padding:6px 14px; background:#fee2e2; color:#991b1b; border:none; border-radius:8px; cursor:pointer; font-size:0.8rem; font-weight:600;">전체 삭제</button>
    </div>
    <div id="wrong-list" class="wrong-list"></div>
  </div>

  <!-- AI 분석 -->
  <div id="tab-ai" class="tab-content">
    <h2 style="font-size:1.1rem; font-weight:700; margin-bottom:6px;"><span data-ic="sparkles"></span> AI 약점 분석</h2>
    <p style="font-size:0.85rem; color:#6b7280; margin-bottom:16px;">오답 노트를 분석해 약점을 진단하고 집중 복습 단어를 추천합니다.</p>
    <button class="ai-btn" onclick="runAnalyze()">분석하기</button>
    <div id="ai-result"></div>
  </div>

  <!-- 통계 -->
  <div id="tab-stats" class="tab-content">
    <div id="stats-area"></div>
  </div>

</div>

<!-- AI 설정 모달 -->
<div id="settings-modal" class="modal-overlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>⚙️ AI 설정</h2>
    <p class="modal-desc">AI 기능(문법 문제, 암기 도우미, 약점 분석)을 쓰려면 본인의 API 키가 필요합니다. 키는 이 기기에만 저장되며 외부로 전송되지 않습니다.</p>

    <label class="field-label">제공자</label>
    <div class="provider-tabs">
      <button id="prov-anthropic" class="provider-tab" onclick="selectProvider('anthropic')">Anthropic (Claude)</button>
      <button id="prov-github" class="provider-tab" onclick="selectProvider('github')">GitHub (무료)</button>
    </div>

    <label class="field-label">API 키</label>
    <input id="api-key-input" class="key-input" type="password" placeholder="키를 붙여넣으세요">

    <label class="field-label">모델 (비워두면 기본값)</label>
    <input id="model-input" class="key-input" type="text" placeholder="기본값 사용">

    <div class="modal-help" id="provider-help"></div>

    <div class="modal-actions">
      <button class="ai-btn" onclick="saveSettings()">저장</button>
      <button class="cancel-btn" onclick="closeSettings()">닫기</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="srs.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
